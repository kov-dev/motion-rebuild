<!--
  styles-rem — global CSS for the Motion rebuild.
  Canonical source: src/styles-rem.html. Webflow holds a copy inside the
  `styles-rem` component (HtmlEmbed, class `code-embed`), placed first in Body
  on every page. Edit here first, then paste into Webflow and read it back.
  Only rules that cannot live in Designer classes belong here.
-->
<style>
  /* rem scale: 1rem = 100px of the layout width per band (1440 / 768 / 375).
     Kept 1:1 with the live site: no upper clamp, bands switch at 991 / 479. */
  html {
    font-size: calc(10000vw / 1440);
    scrollbar-width: none;
  }
  @media (max-width: 991px) {
    html {
      font-size: calc(10000vw / 768);
      -webkit-tap-highlight-color: transparent;
    }
  }
  @media (max-width: 479px) {
    html {
      font-size: calc(10000vw / 375);
    }
  }

  /* Hidden scrollbar (live parity). WebKit needs the pseudo-element. */
  ::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  /* Lenis base CSS (lenis 1.x dist/lenis.css). Re-sync when the version is pinned. */
  html.lenis,
  html.lenis body {
    height: auto;
  }
  .lenis.lenis-smooth {
    scroll-behavior: auto !important;
  }
  .lenis.lenis-smooth [data-lenis-prevent] {
    overscroll-behavior: contain;
  }
  .lenis.lenis-stopped {
    overflow: clip;
  }
  .lenis.lenis-smooth iframe {
    pointer-events: none;
  }

  /* Lessons: underline "View" while its card is hovered (live parity; Designer
     classes cannot style a child from the parent's hover state). */
  .lesson-card:hover .lesson-card-btn {
    text-decoration: underline;
  }
  /* Safari: keep video corners clipped by the rounded media box. */
  .lesson-card-media,
  .lesson-classic-media {
    -webkit-mask-image: -webkit-radial-gradient(white, black);
  }

  /* Easing schemes slider: active label is underlined, the disabled arrow
     inverts its colours (live Splide parity), the track is dragged by code. */
  .lesson-scheme.is-active .lesson-scheme-label {
    text-decoration: underline;
  }
  .lesson-schemes-arrow:disabled {
    background-color: var(--_core---extra-lesson-easing);
    color: var(--_core---neutral-1000);
    cursor: default;
  }
  .lesson-schemes-track {
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Classic animation block: animated film-grain overlay, desktop only
     (live main-css `.classic-anim_wrap::before`). */
  .lesson-classic::before {
    content: "";
    position: absolute;
    z-index: 20;
    inset: 0;
    background: url("https://cdn.prod.website-files.com/6ac8e84728488a6bd334f2fe/6ac8e84728488a6bd334f383_Texture_01.png");
    opacity: 0.2;
    border-top-left-radius: 0.76rem;
    border-top-right-radius: 0.76rem;
    animation: lesson-noise 0.2s infinite;
    pointer-events: none;
  }
  @keyframes lesson-noise {
    0%, 100% { background-position: 0 0; }
    10% { background-position: -5% -10%; }
    20% { background-position: -15% 5%; }
    30% { background-position: 7% -25%; }
    40% { background-position: 20% 25%; }
    50% { background-position: -25% 10%; }
    60% { background-position: 15% 5%; }
    70% { background-position: 0 15%; }
    80% { background-position: 25% 35%; }
    90% { background-position: -10% 10%; }
  }
  @media (max-width: 991px) {
    .lesson-classic::before {
      display: none;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .lesson-classic::before {
      animation: none;
    }
  }
</style>
